name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  backend-tests:
    name: Backend — pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      - name: Create dummy .env
        run: |
          echo "OPENAI_API_KEY=test_key_not_real" >> .env
          echo "ENVIRONMENT=test" >> .env
          echo "CHROMA_DB_PATH=./data/chroma_db" >> .env
          echo "CHROMA_COLLECTION_NAME=health_knowledge" >> .env
          echo "CORS_ORIGINS=http://localhost:3000" >> .env

      - name: Run tests
        run: uv run pytest backend/tests/ -v --tb=short

  frontend-lint:
    name: Frontend — ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint
